[project]
name = "bench"
version = "0.1.0"
description = "A measurement bench for masters. It measures and reports. It writes no audio."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mido>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
